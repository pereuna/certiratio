<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Certiratio rengas</title>
<link rel="manifest" href="direct.webmanifest">
<link rel="apple-touch-icon" href="icons/ring-192.png">
<link rel="icon" href="icons/ring-192.png">
<meta name="theme-color" content="#b25e00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rengas">
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #1d1d1f; --muted: #666; --line: #ddd;
          --v6: #1a7f37; --bad: #c62828; --accent: #b25e00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --fg: #e8e8ea; --muted: #9a9aa0; --line: #333;
            --v6: #4ac26b; --bad: #ff6b6b; --accent: #f0a040; }
  }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; height: 100dvh; max-width: 960px; margin: 0 auto;
         background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  #pad { padding: 16px; }
  #pad label { display: block; margin: 8px 0; }
  #pad input { font: inherit; padding: 6px 8px; width: min(100%, 20em); box-sizing: border-box; }
  button { font: inherit; padding: 6px 14px; }
  .check { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); }
  .check p { margin: 6px 0 0; font-size: 0.9rem; }
  .check.ok { border-color: var(--v6); } .check.bad { border-color: var(--bad); } .check.meh { border-color: #9a6700; }
  details { padding: 4px 16px; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td, th { padding: 2px 6px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
  .cls-ipv6-direct { color: var(--v6); font-weight: 600; } .cls-failed { color: var(--bad); font-weight: 600; }
  #log { list-style: none; padding: 0; margin: 4px 0; max-height: 9em; overflow-y: auto;
         font: 12px/1.35 ui-monospace, monospace; }
  #chat { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 8px 16px; }
  #chat-empty { margin: 8px 0; }
  #chat-head { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  #chat-who { font-weight: 600; }
  #chat-path { font-size: 0.85rem; } #chat-path.ok { color: var(--v6); } #chat-path.bad { color: var(--bad); }
  #msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 10px 0; }
  .msg { max-width: 80%; padding: 6px 10px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
         border: 1px solid var(--line); align-self: flex-start; }
  .msg.out { align-self: flex-end; background: color-mix(in srgb, var(--accent) 16%, transparent);
             border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .msg .state { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  .msg .state.delivered { color: var(--v6); }
  form#dm { display: flex; gap: 8px; padding-top: 6px; }
  form#dm input { flex: 1; min-width: 0; font: inherit; padding: 6px 8px; }
  #dm-note { margin: 4px 0 0; }
  #dm-note:empty { display: none; }
  #pair { padding: 16px; }
  #pair p { margin: 8px 0; }
  .qr { display: block; width: min(78vw, 300px); height: auto; margin: 12px 0; background: #fff; border-radius: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 6px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #bar #status { flex: 1 1 12em; font-size: 0.85rem; }
  #pair.overlay { border-bottom: 1px solid var(--line); }
  #status.ok { color: var(--v6); } #status.bad { color: var(--bad); }
  #step { font-size: 1.1rem; font-weight: 600; }
  #trio { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 14px 0; }
  #trio figure { margin: 0; padding: 8px 10px; border-radius: 12px; text-align: center; min-width: 4.5em;
                 border: 2px solid var(--line); }
  #trio figure.new { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #trio .icon { font-size: 2.6rem; line-height: 1.1; }
  #trio figcaption { font-size: 0.85rem; overflow-wrap: anywhere; }
  #trio .hand { font-size: 1.6rem; }
  #profile input { font: inherit; padding: 6px 8px; width: min(100%, 16em); box-sizing: border-box; }
  #icons { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  #icons button { font-size: 1.6rem; padding: 4px 8px; border-radius: 10px; border: 2px solid var(--line); background: none; }
  #icons button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #cam { display: block; width: min(86vw, 360px); aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #000; margin: 12px 0; }
  .primary { font-weight: 600; }
  #ringview { padding: 6px 16px; border-bottom: 1px solid var(--line); font-size: 0.95rem; line-height: 1.8; }
  #ringview .member { white-space: nowrap; padding: 1px 6px; border-radius: 10px; }
  #ringview button.member { font: inherit; color: inherit; background: none; border: 1px solid var(--line); cursor: pointer; }
  #ringview button.member.chosen { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #ringview .me { font-weight: 700; }
  #ringview .fresh { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  #ringview .arrow { color: var(--muted); margin: 0 3px; }
  #ringview .away { opacity: 0.45; }
  #ringview .here:not(.me)::before { content: "● "; color: var(--v6); font-size: 0.7em; }
  #install { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
  #install-text { flex: 1 1 14em; }
  #me-info { margin: 6px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="install" hidden><span id="install-text"></span><button id="install-go" type="button" hidden>Lisää aloitusnäyttöön</button><button id="install-close" type="button" aria-label="sulje">✕</button></div>

<section id="pair">
  <div id="check" class="check" hidden></div>
  <div id="step"></div>
  <div id="trio" hidden></div>
  <div id="profile" hidden>
    <label>Nimi <input id="name" type="text" maxlength="24" autocomplete="nickname"></label>
    <div id="icons" role="group" aria-label="kuva"></div>
  </div>
  <svg id="qr" class="qr" hidden aria-label="QR-koodi"></svg>
  <div id="cam-box" hidden><video id="cam" playsinline muted></video></div>
  <p class="muted" id="pair-note"></p>
  <div class="row"><button id="primary" class="primary" type="button" hidden></button><button id="secondary" type="button" hidden></button><button id="close" type="button" hidden></button></div>
</section>

<div id="ringview" hidden></div>
<div id="bar" hidden>
  <div id="status"></div>
  <button id="invite" type="button">Kutsu uusi</button>
  <button id="reconnect" type="button">Yhdistä</button>
</div>
<details id="info" hidden>
  <summary id="info-sum">yhteydet</summary>
  <table>
    <thead><tr><th>Puhelin</th><th>Yhteys</th><th>Reitti</th></tr></thead>
    <tbody id="peers"></tbody>
  </table>
  <p id="me-info" class="muted"></p>
  <ul id="log"></ul>
  <button id="forget" type="button" hidden>Poista jäsenyys tästä puhelimesta</button>
</details>

<section id="chat" hidden>
  <p id="chat-empty" class="muted">Valitse renkaasta jäsen, jolle kirjoitat. Viesti kulkee vain teidän kahden puhelimen välillä
    suoralla yhteydellä: muut jäsenet ja rengaspalvelin eivät näe sitä. Jos hän ei ole paikalla, viesti jää
    lähtevään ja lähtee, kun suora yhteys syntyy.</p>
  <div id="chat-head" hidden><div id="chat-who"></div><div id="chat-path"></div></div>
  <div id="msgs"></div>
  <form id="dm" hidden>
    <input id="dm-text" type="text" maxlength="2000" autocomplete="off" enterkeyhint="send" aria-label="viesti">
    <button id="dm-send" type="submit">Lähetä</button>
  </form>
  <p id="dm-note" class="muted"></p>
</section>

<script src="src/vendor/qrcode.js"></script>
<script type="module" src="src/direct.js"></script>
</body>
</html>
