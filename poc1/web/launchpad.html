<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Certiratio IPv6 launchpad</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #1d1d1f; --muted: #666; --line: #ddd;
          --v6: #1a7f37; --bad: #c62828; --l: 38%; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --fg: #e8e8ea; --muted: #9a9aa0; --line: #333;
            --v6: #4ac26b; --bad: #ff6b6b; --l: 70%; }
  }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; height: 100dvh; max-width: 960px; margin: 0 auto;
         background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif; }
  header { padding: 10px 16px 6px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 1.05rem; margin: 0; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  #pad { padding: 16px; }
  #pad label { display: block; margin: 8px 0; }
  #pad input { font: inherit; padding: 6px 8px; width: min(100%, 20em); box-sizing: border-box; }
  button { font: inherit; padding: 6px 14px; }
  .check { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); }
  .check p { margin: 6px 0 0; font-size: 0.9rem; }
  .check.ok { border-color: var(--v6); } .check.bad { border-color: var(--bad); } .check.meh { border-color: #9a6700; }
  details { padding: 4px 16px; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td, th { padding: 2px 6px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
  .cls-ipv6-direct { color: var(--v6); font-weight: 600; } .cls-failed { color: var(--bad); font-weight: 600; }
  #log { list-style: none; padding: 0; margin: 4px 0; max-height: 9em; overflow-y: auto;
         font: 12px/1.35 ui-monospace, monospace; }
  #stream { flex: 1; overflow-y: auto; padding: 10px 16px; white-space: pre-wrap; overflow-wrap: anywhere;
            font: 17px/1.5 ui-monospace, monospace; }
  #stream { cursor: text; }
  #stream span[data-author] { color: hsl(var(--h) var(--s) calc(var(--l) + var(--d))); }
  #caret { display: inline-block; width: 0.55em; height: 1.15em; margin-bottom: -0.2em; background: var(--fg);
           opacity: 0.25; }
  #stream.typing #caret { opacity: 0.8; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #hint { color: var(--muted); font-family: system-ui, sans-serif; font-size: 0.9rem; }
  /* Näkymätön syöte: avaa puhelimen näppäimistön, merkit menevät yhteiseen kursoriin. */
  form#say { position: fixed; left: 0; bottom: 0; width: 100%; height: 2.5em; opacity: 0; pointer-events: none; }
  form#say input { width: 100%; height: 100%; font-size: 16px; border: 0; padding: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>IPv6 launchpad</h1>
  <div class="muted" id="summary">Suora IPv6-vertaisverkko. Palvelin vain esittelee vertaiset; teksti kulkee puhelimesta toiseen.</div>
</header>

<form id="pad">
  <div id="check" class="check"></div>
  <label>Nimimerkki <input id="nick" type="text" maxlength="24" autocomplete="nickname" required></label>
  <button id="join">Liity</button>
  <p class="muted" id="pad-status"></p>
</form>

<details id="info" hidden>
  <summary id="info-sum">vertaiset</summary>
  <table>
    <thead><tr><th>Vertainen</th><th>Yhteys</th><th>Reitti</th><th>Kandidaatit</th></tr></thead>
    <tbody id="peers"></tbody>
  </table>
  <div class="muted" id="cands"></div>
  <ul id="log"></ul>
</details>

<div id="stream" hidden><span id="hint">Napauta ja kirjoita. Kaikkien merkit tulevat samaan kursoriin saapumisjärjestyksessä.
</span><i id="caret"></i></div>
<form id="say" hidden>
  <input id="text" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
         enterkeyhint="enter" aria-label="kirjoita yhteiseen virtaan">
</form>

<script type="module" src="src/launchpad.js"></script>
</body>
</html>
