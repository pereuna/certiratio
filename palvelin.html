<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rengaspalvelimen testi</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #1d1d1f; --muted: #666; --line: #ddd; --v6: #1a7f37; --bad: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --fg: #e8e8ea; --muted: #9a9aa0; --line: #333; --v6: #4ac26b; --bad: #ff6b6b; }
  }
  body { margin: 0 auto; max-width: 720px; padding: 12px 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.45 system-ui, sans-serif; }
  h1 { font-size: 1.05rem; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  #state { margin: 12px 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); font-weight: 600; }
  #state.ok { border-color: var(--v6); color: var(--v6); } #state.bad { border-color: var(--bad); color: var(--bad); }
  textarea { font: 12px ui-monospace, monospace; width: 100%; box-sizing: border-box; }
  button { font: inherit; padding: 6px 14px; }
  #log { list-style: none; padding: 0; font: 12px/1.4 ui-monospace, monospace; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>Rengaspalvelimen testi</h1>
<div class="muted">Yhteys puhelimen rengaspalvelimeen pelkällä kortilla (IPv6-osoite, portti, sormenjälki): ei signalointia, ei DNS-nimeä.</div>
<div id="state">Ei korttia</div>
<textarea id="card" rows="3" placeholder="s1.…"></textarea>
<p><button id="go">Yhdistä</button> <button id="ping" disabled>Lähetä viesti</button></p>
<ul id="log"></ul>
<script type="module">
import { connectCard, decodeCard } from './src/servercard.js';
import { selectedPair } from './src/classify.js';

const $ = (id) => document.getElementById(id);
const t0 = performance.now();
const log = (text) => {
  const li = document.createElement('li');
  li.textContent = `${((performance.now() - t0) / 1000).toFixed(2)} s  ${text}`;
  $('log').prepend(li);
};
const state = (cls, text) => { $('state').className = cls; $('state').textContent = text; };
let ch = null;
let pc = null;
const result = { state: 'idle', pongs: [], pair: null };
window.servertest = result;

async function go() {
  pc?.close();
  let card;
  try { card = decodeCard($('card').value); } catch (e) { state('bad', `Kortti ei kelpaa: ${e.message}`); return; }
  log(`kortti: ${card.addrs.join(', ')} portti ${card.port}`);
  state('', 'Yhdistetään…');
  result.state = 'connecting';
  const start = performance.now();
  try {
    ({ pc, ch } = await connectCard(card));
  } catch (e) {
    state('bad', `Virhe: ${e.message}`);
    result.state = 'error';
    return;
  }
  pc.oniceconnectionstatechange = () => log(`ICE: ${pc.iceConnectionState}`);
  pc.onicegatheringstatechange = () => log(`keräys: ${pc.iceGatheringState}`);
  pc.onicecandidate = (ev) => { if (ev.candidate?.candidate) log(`oma kandidaatti: ${ev.candidate.candidate}`); };
  pc.onconnectionstatechange = () => {
    log(`yhteys: ${pc.connectionState}`);
    if (pc.connectionState === 'failed') { state('bad', 'Yhteys ei syntynyt'); result.state = 'failed'; }
  };
  ch.onopen = async () => {
    const ms = Math.round(performance.now() - start);
    state('ok', `✅ Yhteys palvelimeen (${ms} ms)`);
    result.state = 'open';
    result.ms = ms;
    $('ping').disabled = false;
    const sel = selectedPair(await pc.getStats());
    if (sel) {
      result.pair = `${sel.local?.address ?? '?'} → ${sel.remote?.address ?? '?'}:${sel.remote?.port ?? '?'}`;
      log(`reitti: ${result.pair}`);
    }
    ch.send('hei palvelin');
  };
  ch.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch { return; }
    result.pongs.push(m);
    log(`palvelin vastasi: ${m.text} (näki minut: ${m.from})`);
  };
  ch.onclose = () => { log('kanava suljettu'); $('ping').disabled = true; };
}

$('go').onclick = go;
$('ping').onclick = () => ch?.readyState === 'open' && ch.send(`hei ${new Date().toLocaleTimeString()}`);
const hash = decodeURIComponent(location.hash.slice(1));
if (hash) { $('card').value = hash; go(); }
</script>
</body>
</html>
